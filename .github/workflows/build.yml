name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Fully self-contained: plain g++, no NDK, no external SDK fetch, no
  # network dependency beyond checkout. Compiles and runs
  # tests/mock_world_test.cpp -- verified locally to pass with -Werror.
  unit-tests:
    name: Unit tests (simulation core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run standalone tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -o mock_world_test tests/mock_world_test.cpp
          ./mock_world_test

  # Builds the real Android .so. Depends on things outside this repo (the
  # NDK action, LiteLDev/preloader-android being reachable) that I can't
  # verify from this sandbox -- it follows the documented build steps but
  # I can't personally guarantee it passes the way unit-tests can.
  build-android:
    name: Build native mod (arm64-v8a)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
      - name: Configure
        run: >
          cmake -B build -S .
          -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-24
          -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release -j
      - name: Package .levipack
        run: |
          chmod +x scripts/package.sh
          scripts/package.sh build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluidDynamics-levipack
          path: dist/FluidDynamics.levipack
